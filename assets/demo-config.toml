delay_ms = 1000
active_tab = 1
tree_mode = false
show_kernel_threads = false
show_userland_threads = false
show_containerised = true
layout = "panels"
show_system_panel = true
show_inspector = true
highlight_base_name = false
highlight_deleted_exe = true
color_scheme = "gander"
system_cores_max = 0

[[tabs]]
name = "CPU"
columns = ["PID", "PERCENT_CPU", "PERCENT_MEM", "M_RESIDENT", "COMM"]
[tabs.sort]
field = "PERCENT_CPU"
desc = true

[[tabs]]
name = "Memory"
columns = ["PID", "PERCENT_CPU", "PERCENT_MEM", "M_RESIDENT", "COMM"]
[tabs.sort]
field = "PERCENT_MEM"
desc = true

[[tabs]]
name = "All"
columns = ["PID", "USER", "PRIORITY", "NICE", "M_VIRT", "M_RESIDENT", "STATE", "PERCENT_CPU", "PERCENT_MEM", "TIME", "COMM"]
[tabs.sort]
field = "PID"
desc = false

[[meters_left]]
name = "LeftCPUs"
mode = "bar"
[[meters_left]]
name = "Memory"
mode = "bar"
[[meters_left]]
name = "Swap"
mode = "bar"
[[meters_right]]
name = "Tasks"
mode = "text"
[[meters_right]]
name = "LoadAverage"
mode = "text"
[[meters_right]]
name = "Uptime"
mode = "text"
