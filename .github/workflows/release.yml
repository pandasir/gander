name: Release

# A push of a `v*` tag builds release binaries for every target, bundles
# them into tar.gz archives with checksums, and publishes one GitHub
# Release with all of them attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: gander

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the runner is arm64; the x86_64 target is cross-compiled
          # with the official toolchain (no third-party cross setup needed).
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Linux: gnu for the common case, musl for a fully static binary
          # that runs on any distribution regardless of glibc version.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # The same two for arm64. `ubuntu-24.04-arm` is a GitHub-hosted arm64
          # runner (GA for public repositories), so this needs no emulation and
          # no self-hosted machine. The musl archive is what the arm64 .deb and
          # .rpm are built from, and what lets Homebrew stop compiling on Linux
          # ARM; the gnu archive is for ARM machines whose glibc is new enough.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle
        id: bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="${BIN}-${version}-${{ matrix.target }}"
          dir="${name}"
          mkdir -p "${dir}"
          cp "target/${{ matrix.target }}/release/${BIN}" "${dir}/"
          cp README.md README.zh-CN.md LICENSE "${dir}/"
          tar -czf "${name}.tar.gz" "${dir}"
          # shasum on macOS, sha256sum on Linux.
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "asset=${name}.tar.gz"   >> "$GITHUB_OUTPUT"
          echo "digest=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.bundle.outputs.asset }}
            ${{ steps.bundle.outputs.digest }}

  # FreeBSD is built *inside* a FreeBSD VM rather than cross-compiled.
  #
  # Cross-linking from Linux or macOS fails: the final link wants FreeBSD's
  # `ld`, `-lkvm`, `-ldevstat` and `-lprocstat`, and no hosted runner has them.
  # Every attempt to fake it with a sysroot produces a binary that links and then
  # fails at run time, which is worse than not shipping one. `vmactions` mounts
  # the checkout and writes back, so the release build happens on the same kernel
  # the tests run on.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          usesh: true
          prepare: pkg install -y rust
          run: cargo build --release
      - name: Bundle
        id: bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="x86_64-unknown-freebsd"
          name="${BIN}-${version}-${target}"
          dir="${name}"
          mkdir -p "${dir}"
          cp "target/release/${BIN}" "${dir}/"
          cp README.md README.zh-CN.md LICENSE "${dir}/"
          tar -czf "${name}.tar.gz" "${dir}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "asset=${name}.tar.gz"            >> "$GITHUB_OUTPUT"
          echo "digest=${name}.tar.gz.sha256"     >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-unknown-freebsd
          path: |
            ${{ steps.bundle.outputs.asset }}
            ${{ steps.bundle.outputs.digest }}

  release:
    # `build` alone was the dependency until v0.6.0, which meant the FreeBSD job
    # below built its artifact, uploaded it, and then had it silently dropped:
    # `download-artifact` only sees artifacts from *upstream* jobs, and `freebsd`
    # is a sibling. Every release before v0.6.0 was therefore missing the one
    # platform that milestone added, with nothing red anywhere — the job
    # succeeded, the release succeeded, and the file was simply not attached.
    needs: [build, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the real tag object
        # `actions/checkout` on a tag ref runs
        #   git fetch --no-tags --depth=1 origin +<sha>:refs/tags/<tag>
        # which points the tag ref at the *commit*, so `git cat-file -t` reports
        # "commit" and the annotated tag — i.e. the release notes — never arrives.
        # v0.6.0 passed by luck; v0.6.1 failed with "lightweight tag" while the tag
        # on the remote is annotated. Re-fetching the ref explicitly gets the tag
        # object back. `--force` because the shallow ref already exists.
        run: |
          git fetch --force --depth=1 origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind=$(git cat-file -t "${GITHUB_REF_NAME}")
          echo "${GITHUB_REF_NAME} is a ${kind}"
          if [ "$kind" != tag ]; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag on the remote"
            exit 1
          fi

      - name: The tag and the manifest must agree
        # `--version` reads `CARGO_PKG_VERSION` from `Cargo.toml`, so a tag pushed
        # without a version bump publishes binaries that report the *previous*
        # version under the new version's filename — an install that looks fine and
        # says the wrong thing. docs/RELEASING.md used to call the bump "the only
        # defence", which is a worse answer than a two-line check.
        run: |
          declared=$(grep -m1 '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tagged="${GITHUB_REF_NAME#v}"
          if [[ "$declared" != "$tagged" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $declared"
            echo "Bump [workspace.package] version and packaging, then re-tag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml $declared"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release body from the tag
        # The body is built from the tag's own message by a script, not written here.
        # It used to be a static block: identical for every tag, so the Releases page
        # said nothing about what changed while the tag message — which said it well —
        # was visible only to `git`. The script refuses to produce an empty body and
        # refuses a lightweight tag, so a release cannot ship without notes.
        run: |
          body="$(.github/scripts/build-release-body.sh "$GITHUB_REF_NAME")"
          printf '%s\n' "$body" > "$RUNNER_TEMP/body.md"
          echo "release body: $(wc -c < "$RUNNER_TEMP/body.md" | tr -d ' ') bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/body.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Linux packages: .deb and .rpm built from the *published* musl archives.
  #
  # This is a separate job, after `release`, on purpose. Building the packages in
  # the `build` matrix would mean the same crate is compiled twice and the
  # package could be made from a binary that never became an asset; downloading
  # the asset it ships in means the package and the tarball cannot disagree.
  #
  # Nothing here is signed. A signed .deb/.rpm only matters for a repository that
  # users `apt install` from by name (see packaging/README.md); for
  # `apt install ./gander.deb` the checksum published beside the file is what
  # proves it came from here.
  packages:
    needs: release
    # Built on a runner of the same architecture as the package. `rpmbuild` from
    # Debian and Ubuntu refuses to build for a foreign architecture at all
    # ("No compatible architectures found for build") -- not even with
    # `--target` and `_target_cpu` set, which is what the first attempt tried.
    # Building natively sidesteps that entirely, and the arm64 runners are free
    # for public repositories.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64, rpm_arch: x86_64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, arch: arm64, rpm_arch: aarch64, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio binutils

      - name: Download the release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${VERSION#v}"
          asset="gander-${version}-${{ matrix.target }}.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          mkdir -p dist
          curl -fsSL -o "dist/${asset}" "${base}/${asset}"
          curl -fsSL -o "dist/${asset}.sha256" "${base}/${asset}.sha256"
          (cd dist && sha256sum -c "${asset}.sha256")
          tar -xzf "dist/${asset}" -C dist
          echo "BINARY=dist/gander-${version}-${{ matrix.target }}/gander" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # Report what the runner actually is, so a package built on the wrong
          # architecture is visible in the log rather than in the artifact.
          echo "runner arch: $(uname -m), package arch: ${{ matrix.arch }}"
          file "$PWD/dist/gander-${version}-${{ matrix.target }}/gander" | cut -c1-120

      - name: Build the packages
        run: |
          packaging/deb/build-deb.sh "$BINARY" "$VERSION" ${{ matrix.arch }} dist
          packaging/rpm/build-rpm.sh "$BINARY" "$VERSION" ${{ matrix.rpm_arch }} dist

      - name: Check dependencies, linkage and layout
        run: packaging/check-packages.sh dist/*.deb dist/*.rpm

      - name: Sign the RPMs
        # apt authenticates the index and the index carries the package hash, so
        # a .deb needs no signature of its own. dnf users expect a per-package
        # signature as well as repo_gpgcheck, so the RPMs are signed here and the
        # signature is checked before the package is allowed into the repository.
        env:
          # The encrypted form of the key, so the secret is useless without the
          # passphrase. See docs/SIGNING.md.
          GANDER_GPG_PRIVATE_KEY_ENC: ${{ secrets.GANDER_GPG_PRIVATE_KEY_ENC }}
          GANDER_GPG_PASSPHRASE: ${{ secrets.GANDER_GPG_PASSPHRASE }}
          GANDER_GPG_KEY_ID: ${{ secrets.GANDER_GPG_KEY_ID }}
        run: |
          if [ -z "${GANDER_GPG_PRIVATE_KEY_ENC:-}" ] || [ -z "${GANDER_GPG_PASSPHRASE:-}" ]; then
            echo "::error::GANDER_GPG_PRIVATE_KEY_ENC and GANDER_GPG_PASSPHRASE must be configured; see docs/SIGNING.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p dist/signing
          .github/scripts/gpg-setup.sh setup dist/signing
          . "$RUNNER_TEMP/gander-signing.env"
          packaging/sign-packages.sh dist/*.rpm
          # The key material must not travel with the artifacts.
          rm -rf "$GNUPGHOME"

      - name: Install the packages in clean containers
        # The archive being correct is not the product; the distribution's own
        # resolver accepting the package and the installed binary running is.
        # RPMs are signed by now, and the signing key is not imported here, so the
        # signature is deliberately not verified at this step -- it is verified
        # when a real client installs from the repository below.
        run: |
          set -eu
          docker run --rm -v "$PWD/dist:/dist:ro" --platform linux/${{ matrix.arch }} \
            debian:12 sh -ec '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb
              gander --version
              gander --json --limit 1 >/tmp/sample.json
              test -s /tmp/sample.json
              echo "debian:12/${{ matrix.arch }} installed and ran $(gander --version)"
            '
          docker run --rm -v "$PWD/dist:/dist:ro" --platform linux/${{ matrix.arch }} \
            rockylinux:9 sh -ec '
              dnf -y -q install --nogpgcheck /dist/*.rpm
              gander --version
              gander --json --limit 1 >/tmp/sample.json
              test -s /tmp/sample.json
              echo "rockylinux:9/${{ matrix.arch }} installed and ran $(gander --version)"
            '

      # No `SHA256SUMS` here. This job is one architecture of two, so a file
      # written here covers only this architecture's packages — and
      # `merge-multiple: true` below makes the two files overwrite each other, so
      # the release ended up with whichever job finished last. Every release from
      # v0.6.4 to v0.6.6 shipped a SHA256SUMS listing one architecture: v0.6.4
      # had amd64 only, v0.6.5 and v0.6.6 arm64 only. Nothing was red, because a
      # checksum file that is missing entries still parses.
      #
      # `publish-packages` writes it once, over the merged tree, which is the
      # only place that sees both architectures.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/signing/gander.gpg
            dist/signing/RPM-GPG-KEY-gander

  # Attach the packages to the release that `packages` was built against.
  publish-packages:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Write checksums
        # One file, written after both architectures have been merged, so it
        # covers all four packages. Written per-architecture inside the `packages`
        # matrix it could only ever list half of them, and the two halves
        # overwrote each other (see the note in that job).
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
          cat SHA256SUMS
          # A checksum file that names fewer packages than the release ships is
          # the bug this step exists to prevent, so assert it rather than trust it.
          packages=$(ls -1 ./*.deb ./*.rpm | wc -l)
          listed=$(wc -l < SHA256SUMS)
          if [ "$packages" -ne "$listed" ]; then
            echo "::error::SHA256SUMS lists ${listed} packages but dist has ${packages}"
            exit 1
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` resolves the repository from the working directory, and this job
          # has no checkout, so it failed with "not a git repository". Naming the
          # repository explicitly is the fix; a checkout would only be there to
          # satisfy a lookup that does not need one.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber

  # Publish the signed apt and rpm repositories at https://pandasir.github.io/gander/
  #
  # The tree is carried on the `repo` branch rather than regenerated: users pin
  # versions, and an `apt upgrade` that removes the package they are running is a
  # bug. Each release copies its packages in and rebuilds the indexes around
  # everything present.
  #
  # This is the only job that holds the signing key. It is scoped to one job so a
  # compromised or misconfigured step elsewhere cannot read it.
  publish-repo:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm apt-utils dpkg-dev gnupg createrepo-c

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Check out the existing repository tree
        # The tree is a published artifact, not source, so it lives on its own
        # branch rather than in `main`.
        #
        # A fresh `git init` in a subdirectory has no `origin` remote, so the
        # push at the end of this job would fail on the very first release -- a
        # path that only ever runs once and is therefore never exercised again.
        # The remote is set explicitly instead of relying on inheritance.
        run: |
          if git fetch --depth=1 origin repo 2>/dev/null; then
            echo "repo branch exists; adding a worktree"
            git worktree add repo-tree FETCH_HEAD
          else
            echo "no repo branch yet; starting one"
            mkdir repo-tree
            git -C repo-tree init -q
            git -C repo-tree checkout -q --orphan repo
            git -C repo-tree remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C repo-tree config user.name 'gander release'
          git -C repo-tree config user.email 'gander-maintainers@users.noreply.github.com'

      - name: Sign and index
        env:
          # The encrypted form of the key, so the secret is useless without the
          # passphrase. See docs/SIGNING.md.
          GANDER_GPG_PRIVATE_KEY_ENC: ${{ secrets.GANDER_GPG_PRIVATE_KEY_ENC }}
          GANDER_GPG_PASSPHRASE: ${{ secrets.GANDER_GPG_PASSPHRASE }}
          GANDER_GPG_KEY_ID: ${{ secrets.GANDER_GPG_KEY_ID }}
        run: |
          if [ -z "${GANDER_GPG_PRIVATE_KEY_ENC:-}" ] || [ -z "${GANDER_GPG_PASSPHRASE:-}" ]; then
            echo "::error::GANDER_GPG_PRIVATE_KEY_ENC and GANDER_GPG_PASSPHRASE must be configured; see docs/SIGNING.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          .github/scripts/gpg-setup.sh setup repo-tree
          . "$RUNNER_TEMP/gander-signing.env"
          .github/scripts/merge-repo.sh dist repo-tree 5
          .github/scripts/gpg-setup.sh verify repo-tree

      - name: Register QEMU for foreign-architecture clients
        # The runner is x86_64, so `--platform linux/arm64` fails with "exec
        # format error" without binfmt handlers registered. That error is
        # indistinguishable from a broken arm64 package, which is the one thing
        # this step exists to rule out.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Verify the repository as a client would
        # A repository that builds is not a repository that installs. Each client
        # checks the signature chain end to end here, which is the only place it
        # is exercised before users do it.
        #
        # `--network host` rather than a published port plus host.docker.internal:
        # that name is a Docker Desktop convenience and does not resolve inside
        # containers on a Linux runner, which is where this runs. With host
        # networking the client reaches the server on the runner's own loopback.
        run: |
          set -eu
          port=18080
          docker run -d --rm --name repo-server --network host \
            -v "$PWD/repo-tree:/srv:ro" python:3-alpine \
            sh -c "cd /srv && python3 -m http.server $port" >/dev/null
          trap 'docker rm -f repo-server >/dev/null 2>&1 || true' EXIT

          # Wait for the server rather than sleeping a fixed amount: a pulled
          # image can take seconds to start, and the failure mode of guessing
          # short is a confusing "could not resolve" rather than "not up yet".
          for _ in $(seq 30); do
            if curl -fsS "http://127.0.0.1:$port/dists/stable/Release" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$port/dists/stable/Release" >/dev/null

          # Client configuration, with the published URL swapped for the local
          # one. Written here rather than inline so the heredoc is not nested in
          # a `sh -c` string.
          sed "s|https://pandasir.github.io/gander/|http://127.0.0.1:$port/|g" \
            repo-tree/gander.repo > /tmp/gander.repo

          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --network host \
              -v /tmp/gander.repo:/etc/yum.repos.d/gander.repo:ro \
              debian:12 sh -ec "
                apt-get update -qq >/dev/null 2>&1
                apt-get install -y -qq gnupg curl >/dev/null 2>&1
                curl -fsSL http://127.0.0.1:$port/gander.gpg | gpg --dearmor -o /usr/share/keyrings/gander.gpg
                echo 'deb [signed-by=/usr/share/keyrings/gander.gpg] http://127.0.0.1:$port stable main' > /etc/apt/sources.list.d/gander.list
                apt-get update
                apt-get install -y -qq gander
                gander --version
                gander --json --limit 1 >/tmp/s.json
                test -s /tmp/s.json
                echo \"apt install gander works on $arch\"
              "
            docker run --rm --platform "linux/$arch" --network host \
              -v /tmp/gander.repo:/etc/yum.repos.d/gander.repo:ro \
              rockylinux:9 sh -ec "
                rpm --import http://127.0.0.1:$port/RPM-GPG-KEY-gander
                dnf -y -q install gander
                gander --version
                gander --json --limit 1 >/tmp/s.json
                test -s /tmp/s.json
                echo \"dnf install gander works on $arch\"
              "
          done

      - name: Publish to the repo branch
        run: |
          cd repo-tree
          git add -A
          # A release that changed nothing in the repository means the merge step
          # silently did nothing, so an empty commit is a failure, not a no-op.
          if git diff --cached --quiet; then
            echo "::error::the repository tree did not change; merge-repo.sh did nothing"
            exit 1
          fi
          git commit -m "repo: ${GITHUB_REF_NAME}"
          git push origin HEAD:repo

  # GitHub Pages serves the repository *and* the landing page.
  #
  # Kept separate from the push so a Pages failure is visible as its own red job
  # rather than looking like a broken repository.
  #
  # Two checkouts, on purpose. `repo` is the published artifact tree (packages and
  # their indexes); `main` is where site/ and assets/ live. The landing page is
  # assembled here rather than committed to the repo branch, so editing it does
  # not mean hand-editing a generated branch, and the screenshots have exactly one
  # copy in git.
  deploy-pages:
    needs: publish-repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo
          # The tree is published verbatim; a checkout with history would put a
          # .git directory in the served tree, and Pages would happily serve it.
          fetch-depth: 1
          persist-credentials: false
          path: repo-tree

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: site-src

      - name: Assemble the landing page
        # The page links the screenshots by bare filename (`screenshot-panels.png`)
        # so the same <img src> works from the README, from Pages, and from a
        # local `python3 -m http.server` in site/. Copying them to the root of the
        # published tree is what keeps that true without a second set of paths.
        run: |
          set -eu
          # Glob, not a file list: the comparison pages were added after this
          # workflow was written, and a hardcoded copy step would have deployed a
          # green build in which the new URLs 404. The explicit checks below are
          # what stops a glob that matches nothing from passing.
          cp -f site-src/site/*.html repo-tree/
          cp -f site-src/site/*.css repo-tree/
          cp -f site-src/site/*.js repo-tree/
          cp -f site-src/site/robots.txt repo-tree/robots.txt
          cp -f site-src/site/sitemap.xml repo-tree/sitemap.xml
          cp -f site-src/assets/*.png repo-tree/
          cp -f site-src/assets/demo.gif repo-tree/
          cp -f site-src/assets/demo.webm repo-tree/
          cp -f site-src/assets/demo.mp4 repo-tree/
          # The IndexNow key file (see site/61dfc108*.txt). Bing verifies it at
          # this exact path before accepting the submitted URLs.
          cp -f site-src/site/61dfc108afd102fcd90caee0b0ff0af4.txt repo-tree/
          # A build that silently published nothing would leave the old page up,
          # which looks like a deploy that worked. Check the files are there and
          # that the version in the page matches the tag being released.
          for f in index.html vs-htop.html vs-btop.html vs-bottom.html \
                   htop-for-macos.html htop-for-freebsd.html json-process-list.html \
                   site.css analytics.js \
                   robots.txt sitemap.xml \
                   screenshot-panels.png screenshot-htop.png screenshot-tree.png \
                   social-preview.png demo.gif demo.webm demo.mp4 \
                   61dfc108afd102fcd90caee0b0ff0af4.txt; do
            test -s "repo-tree/$f" || { echo "::error::repo-tree/$f is missing or empty"; exit 1; }
          done
          # A sitemap entry with no page behind it is a 404 advertised to a
          # crawler, which is worse than no sitemap.
          for url in $(grep -oE '<loc>[^<]+' site-src/site/sitemap.xml | sed 's/<loc>//'); do
            name=${url##*/gander/}
            [ -n "$name" ] || name=index.html
            test -s "repo-tree/$name" || { echo "::error::sitemap lists $url but $name is not published"; exit 1; }
          done
          grep -q "softwareVersion\": \"${GITHUB_REF_NAME#v}\"" repo-tree/index.html \
            || echo "::warning::index.html does not declare ${GITHUB_REF_NAME#v}; bump site/index.html"
          ls -la repo-tree | head -20

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo-tree
      - id: deployment
        uses: actions/deploy-pages@v4

  # The static musl archive is the install path for Ubuntu, CentOS and other
  # distributions. Building it is not enough: the product is the archive after
  # download, extraction and execution on a distribution with a different glibc
  # from the build runner. CentOS 7 is the oldest target we claim to support;
  # Ubuntu 24.04 is the current LTS.
  linux-install:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:24.04"
          - "centos:7"
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install download and checksum tools
        if: matrix.image == 'ubuntu:24.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl coreutils tar
      - name: Download, verify and run the release
        env:
          VERSION: ${{ github.ref_name }}
          # The image name is used in the messages below, including the failure
          # paths. It used to be `${IMAGE}`, which is not defined anywhere: under
          # `set -u` the *success* path then died with "IMAGE: parameter not set"
          # after the archive had downloaded, verified and run -- a green check
          # away from passing, failing on the last line.
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          version="${VERSION#v}"
          target=x86_64-unknown-linux-musl
          asset="gander-${version}-${target}.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          if command -v curl >/dev/null; then
            curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
            curl -fsSL -o "/tmp/${asset}.sha256" "${base}/${asset}.sha256"
          else
            # CentOS 7's minimal image ships curl; fail clearly if that changes.
            echo "::error::curl is required in ${IMAGE}"
            exit 1
          fi

          cd /tmp
          if command -v sha256sum >/dev/null; then
            sha256sum -c "${asset}.sha256"
          else
            echo "::error::sha256sum is required in ${IMAGE}"
            exit 1
          fi
          tar -xzf "${asset}"
          "./gander-${version}-${target}/gander" --version
          "./gander-${version}-${target}/gander" --json --limit 1 >/tmp/sample.json
          test -s /tmp/sample.json
          echo "${IMAGE}: ${asset} runs"
