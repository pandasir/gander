name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The tree is not fully rustfmt-clean yet. Check only the Rust files this
      # change touches, so contributors are not asked to reformat the whole
      # workspace to land a two-line fix.
      - name: Check formatting of changed Rust files
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.rs')
          if [ -z "$changed" ]; then
            echo "no Rust files changed"
            exit 0
          fi
          echo "$changed"
          rustfmt --edition 2021 --check $changed
      # The live Linux tests run in a container locally; on the runner the
      # plain process table is exercised anyway. Install nothing extra.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check Homebrew download and dependency matrix
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew ruby packaging/homebrew/test_formula.rb

  # The .deb and .rpm packages are sold on two claims: they declare no runtime
  # dependencies, and their payload links against nothing. Both are cheap to
  # check and expensive to get wrong, because the failure mode is a package that
  # installs on the build machine and refuses to start on a user's.
  #
  # The release workflow rebuilds and rechecks these against the published
  # archives; this job exists so a broken spec or script fails on the pull
  # request instead of at tag time.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-musl

      - name: Install packaging tools
        # musl-tools supplies the musl-gcc the musl target needs; rpm and cpio
        # are for building and unpacking the RPM.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools rpm cpio binutils

      - name: Build the static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Build and check the packages
        run: |
          version=$(grep -m1 '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          binary=target/x86_64-unknown-linux-musl/release/gander
          packaging/deb/build-deb.sh "$binary" "$version" amd64 dist
          packaging/rpm/build-rpm.sh "$binary" "$version" x86_64 dist
          packaging/check-packages.sh dist/*.deb dist/*.rpm

      - name: Install the packages in clean containers
        # The point is not that the archive unpacks but that the distribution's
        # own resolver accepts it with nothing else installed, and that the
        # binary it lands runs. `apt install ./file.deb` and `dnf install
        # ./file.rpm` both consult dependencies, so a stale `Depends`/`Requires`
        # line shows up here as an install failure.
        run: |
          set -eu
          deb=$(ls dist/*.deb)
          rpm=$(ls dist/*.rpm)
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb
            gander --version
            gander --json --limit 1 >/tmp/sample.json
            test -s /tmp/sample.json
            echo "debian:12 installed and ran $(gander --version)"
          '
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -ec '
            dnf -y -q install /dist/*.rpm
            gander --version
            gander --json --limit 1 >/tmp/sample.json
            test -s /tmp/sample.json
            echo "rockylinux:9 installed and ran $(gander --version)"
          '
          echo "checked $deb and $rpm"

  # FreeBSD has no GitHub-hosted runner, so the backend is checked two ways.
  #
  # This job only *compiles* it, which is cheap and catches the common
  # regression: a new `cfg` arm that forgets a target, or a `libc` item that
  # exists on two platforms and not the third. It is deliberately not the whole
  # story — the `freebsd-vm` job below runs the suite on a real kernel, because
  # this project has already learned that "it compiles" is worth little (see
  # docs/PORTABILITY.md).
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-freebsd
      - run: cargo clippy --target x86_64-unknown-freebsd --all-targets -- -D warnings

  # The FreeBSD suite, on a real FreeBSD kernel in QEMU.
  #
  # `vmactions/freebsd-vm` boots a VM with a shared directory, so this is a live
  # run: `freebsd_live.rs` compares gander's figures against `ps(1)`,
  # `sysctl(8)`, `swapinfo(8)` and `netstat(1)` inside the guest. That is what
  # caught the `SSLEEP`-is-three-states bug and the `KERN_PROC_CWD` struct that
  # looked like a permission failure.
  freebsd-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo test --workspace
            cargo clippy --workspace --all-targets -- -D warnings

  # The `rust-version` in Cargo.toml is a promise to users, and nothing enforced
  # it. It had drifted two minor versions behind reality (declared 1.75 while
  # ratatui 0.30 needs 1.88), so `cargo install` on a machine that satisfied the
  # stated MSRV failed to build. This job builds against the declared version, so
  # a dependency bump that raises the floor breaks CI instead of a user's install.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building against $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo build --workspace
