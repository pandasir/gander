name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The tree is not fully rustfmt-clean yet. Check only the Rust files this
      # change touches, so contributors are not asked to reformat the whole
      # workspace to land a two-line fix.
      - name: Check formatting of changed Rust files
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.rs')
          if [ -z "$changed" ]; then
            echo "no Rust files changed"
            exit 0
          fi
          echo "$changed"
          rustfmt --edition 2021 --check $changed
      # The live Linux tests run in a container locally; on the runner the
      # plain process table is exercised anyway. Install nothing extra.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  # FreeBSD has no GitHub-hosted runner, so the backend is checked two ways.
  #
  # This job only *compiles* it, which is cheap and catches the common
  # regression: a new `cfg` arm that forgets a target, or a `libc` item that
  # exists on two platforms and not the third. It is deliberately not the whole
  # story — the `freebsd-vm` job below runs the suite on a real kernel, because
  # this project has already learned that "it compiles" is worth little (see
  # docs/PORTABILITY.md).
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-freebsd
      - run: cargo clippy --target x86_64-unknown-freebsd --all-targets -- -D warnings

  # The FreeBSD suite, on a real FreeBSD kernel in QEMU.
  #
  # `vmactions/freebsd-vm` boots a VM with a shared directory, so this is a live
  # run: `freebsd_live.rs` compares gander's figures against `ps(1)`,
  # `sysctl(8)`, `swapinfo(8)` and `netstat(1)` inside the guest. That is what
  # caught the `SSLEEP`-is-three-states bug and the `KERN_PROC_CWD` struct that
  # looked like a permission failure.
  freebsd-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo test --workspace
            cargo clippy --workspace --all-targets -- -D warnings

  # The `rust-version` in Cargo.toml is a promise to users, and nothing enforced
  # it. It had drifted two minor versions behind reality (declared 1.75 while
  # ratatui 0.30 needs 1.88), so `cargo install` on a machine that satisfied the
  # stated MSRV failed to build. This job builds against the declared version, so
  # a dependency bump that raises the floor breaks CI instead of a user's install.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building against $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo build --workspace
