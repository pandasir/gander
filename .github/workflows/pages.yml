name: Pages

# Publish the landing page when it changes.
#
# The release workflow also deploys Pages, because every release copies packages
# into the same tree; that path is triggered by a tag. This one exists for the
# other case: a change to site/ or to a screenshot, with no release. Without it,
# the page would only ever be rebuilt at tag time, so a typo fix would sit
# unpublished for however long the next release takes.
#
# Both workflows publish the same artifact shape (the `repo` branch tree plus the
# landing page), and GitHub Pages keeps the newest deployment, so they cannot
# fight over the result: whichever ran last is the tree that is live.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued page build is fine; two racing ones would
# publish in an order nobody chose.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo
          fetch-depth: 1
          persist-credentials: false
          path: repo-tree

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: site-src

      - name: Assemble the landing page
        # Same assembly as the release workflow, and for the same reason: the page
        # refers to the screenshots by bare filename, so they have to sit next to
        # index.html in the published tree.
        #
        # The HTML is copied by glob rather than by name. Listing the pages was
        # how the comparison pages would silently fail to deploy: the workflow
        # would go green and the new URLs would 404. The explicit list that
        # follows is the guard, so a glob that matches nothing still fails.
        run: |
          set -eu
          cp -f site-src/site/*.html repo-tree/
          cp -f site-src/site/*.css repo-tree/
          cp -f site-src/site/*.js repo-tree/
          cp -f site-src/site/robots.txt repo-tree/robots.txt
          cp -f site-src/site/sitemap.xml repo-tree/sitemap.xml
          cp -f site-src/site/llms.txt repo-tree/llms.txt
          # The translated sites live in subdirectories, which the top-level
          # glob does not cover — their absence is exactly what the sitemap
          # check below catches, but copying them here is what makes it pass.
          for lang in zh-CN ja ko; do
            mkdir -p "repo-tree/$lang"
            cp -f "site-src/site/$lang/"*.html "repo-tree/$lang/"
          done
          cp -f site-src/assets/*.png repo-tree/
          cp -f site-src/assets/demo.gif repo-tree/
          cp -f site-src/assets/demo.webm repo-tree/
          cp -f site-src/assets/demo.mp4 repo-tree/
          # The IndexNow key file (see site/61dfc108*.txt). Bing verifies it at
          # this exact path before accepting the submitted URLs.
          cp -f site-src/site/61dfc108afd102fcd90caee0b0ff0af4.txt repo-tree/
          for f in index.html vs-htop.html vs-btop.html vs-bottom.html \
                   htop-for-macos.html htop-for-freebsd.html json-process-list.html \
                   site.css analytics.js \
                   robots.txt sitemap.xml llms.txt \
                   screenshot-panels.png screenshot-htop.png screenshot-tree.png \
                   social-preview.png demo.gif demo.webm demo.mp4 \
                   61dfc108afd102fcd90caee0b0ff0af4.txt; do
            test -s "repo-tree/$f" || { echo "::error::repo-tree/$f is missing or empty"; exit 1; }
          done
          # Every page named in the sitemap has to exist, or the sitemap
          # advertises 404s.
          for url in $(grep -oE '<loc>[^<]+' site-src/site/sitemap.xml | sed 's/<loc>//'); do
            name=${url##*/gander/}
            [ -n "$name" ] || name=index.html
            # A directory URL is served by the index page inside it; test -s
            # would pass on the directory itself, which proves nothing.
            case "$name" in */) name="$name"index.html ;; esac
            test -s "repo-tree/$name" || { echo "::error::sitemap lists $url but $name is not published"; exit 1; }
          done
          # The version in the page is a fact, not decoration: it is what a search
          # result shows. Compare it to Cargo.toml rather than to a tag, because
          # this workflow does not run on a tag.
          declared=$(grep -m1 '^version' site-src/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if ! grep -q "softwareVersion\": \"${declared}\"" repo-tree/index.html; then
            echo "::error::site/index.html declares a different version than Cargo.toml (${declared})"
            exit 1
          fi
          echo "publishing gander ${declared}"

          # The published package index has to be at least as new as the page.
          #
          # This workflow reads the `repo` branch, which is written by a tag run of
          # release.yml. On a release, `main` is pushed before the tag, so this
          # workflow starts first and can finish holding a `repo` snapshot from
          # *before* the new packages were merged — and Pages keeps the newest
          # deployment, so publishing that snapshot replaces the new packages with
          # the previous ones. v0.6.5 shipped exactly that way: the page said 0.6.5
          # while `dists/` served 0.6.4, and both runs were green.
          #
          # Failing here is the honest outcome: the page and the packages have to
          # describe the same release, and the fix is to re-run this workflow once
          # publish-repo has landed.
          if [ -f repo-tree/dists/stable/main/binary-amd64/Packages ]; then
            newest=$(grep '^Version:' repo-tree/dists/stable/main/binary-amd64/Packages \
                     | sed 's/^Version: //; s/-[0-9]*$//' | sort -V | tail -1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$declared" | sort -V | tail -1)" != "$newest" ]; then
              echo "::error::the repo branch has packages up to ${newest}, but this page publishes ${declared}"
              echo "The release packages have not been merged yet (or were merged after"
              echo "this run checked out). Re-run this workflow; do not deploy a page that"
              echo "advertises a version the package repository does not serve."
              exit 1
            fi
            echo "package index is at ${newest}, page at ${declared}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo-tree
      - id: deployment
        uses: actions/deploy-pages@v4
