[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/tui",
    "crates/bin",
]

[workspace.package]
version = "0.6.5"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"
authors = ["gander contributors"]
repository = "https://github.com/pandasir/gander"
homepage = "https://github.com/pandasir/gander"
readme = "README.md"
# Keywords are what crates.io search and the docs.rs page read. `htop` is the
# word people actually type when they are looking for this category, and
# `process-viewer` / `system-monitor` are the crates.io categories that exist;
# five is the registry's limit, so these are the five that carry traffic.
keywords = ["htop", "process-viewer", "system-monitor", "tui", "terminal"]
categories = ["command-line-utilities", "os"]

[workspace.dependencies]
gander-core = { version = "0.6.5", path = "crates/core" }
gander-config = { version = "0.6.5", path = "crates/config" }
gander-tui = { version = "0.6.5", path = "crates/tui" }

# core
memchr = "2"
arrayvec = "0.7"
rayon = "1"
libc = "0.2"

# config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# tui
ratatui = "0.30"
crossterm = "0.29"
arc-swap = "1"

# common
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
